# Build y deploy de Hoja de Ruta al App Service "logistica" (Node).
# Un solo job (sin artifacts), mismo criterio que las otras apps para no
# consumir almacenamiento de Actions.
#
# ⚠️ Requiere: App Service "logistica" (Node 20, Linux) con Basic authentication
# prendido, y el secret con el publish profile en
# GitHub → Settings → Secrets → AZUREAPPSERVICE_PUBLISHPROFILE_LOGISTICA.

name: Build and deploy Node.js app to Azure Web App - logistica

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # El publish profile se expone como env para condicionar el deploy: mientras no
    # exista el secret (App Service todavía no creado), el build corre igual y el
    # deploy se SALTEA — así el workflow queda en verde en vez de fallar.
    env:
      PUBLISH_PROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_LOGISTICA }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install server dependencies
        run: npm install

      - name: Build Frontend
        run: |
          cd client
          npm install
          npm run build

      - name: 'Deploy to Azure Web App'
        if: ${{ env.PUBLISH_PROFILE != '' }}
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'logistica'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ env.PUBLISH_PROFILE }}

      - name: Deploy omitido (sin publish profile)
        if: ${{ env.PUBLISH_PROFILE == '' }}
        run: echo "::notice::Deploy omitido — falta el secret AZUREAPPSERVICE_PUBLISHPROFILE_LOGISTICA (App Service aún no creado). El build pasó OK."
